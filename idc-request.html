<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>인프라 자동화 플랫폼 - IDC 요청</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar" id="sidebar"></aside>

        <main class="main-content">
            <header class="content-header">
                <h2>상면관리 IDC 요청</h2>
            </header>
            <div class="content-body">
                <!-- IDC 기본 정보 -->
                <div class="card">
                    <div class="card-header"><h3>IDC 기본 정보</h3></div>
                    <div class="card-body">
                        <div class="form-grid">
                            <div class="form-group">
                                <label class="form-label">IDC 이름</label>
                                <input type="text" class="form-input" id="idc-name" placeholder="예: 호스트웨이IDC">
                            </div>
                            <div class="form-group">
                                <label class="form-label">IDC 주소</label>
                                <input type="text" class="form-input" id="idc-address" placeholder="비워두면 IDC 이름과 동일">
                                <span class="form-hint">자동으로 IDC 이름과 동기화 (직접 수정 가능)</span>
                            </div>
                            <div class="form-group">
                                <label class="form-label">공급업체 코드</label>
                                <input type="number" class="form-input" id="idc-supply-code" value="280">
                                <span class="form-hint">company 테이블에서 확인</span>
                            </div>
                            <div class="form-group">
                                <label class="form-label">작업자 ID</label>
                                <input type="text" class="form-input" id="user-id" placeholder="예: EP10579">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Display Order</label>
                                <input type="number" class="form-input" id="display-order" placeholder="예: 36">
                            </div>
                            <div class="form-group">
                                <label class="form-label">예상 IDC ID</label>
                                <input type="number" class="form-input" id="idc-id" placeholder="예: 37">
                                <span class="form-hint">중복 등록 방지를 위해 사전 확인 필요</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Zone 목록 (JS에서 동적 렌더링) -->
                <div id="zones-container"></div>

                <div class="action-bar mb-16">
                    <button class="btn btn-outline" id="btn-add-zone">+ Zone(층) 추가</button>
                </div>

                <div class="action-bar mb-16">
                    <button class="btn btn-primary" id="btn-generate">SQL 쿼리 생성</button>
                    <button class="btn btn-outline" id="btn-load-example">예제 데이터 불러오기</button>
                </div>

                <!-- 상면 미리보기 -->
                <div class="card hidden" id="preview-card">
                    <div class="card-header">
                        <h3>상면 배치도</h3>
                        <span class="form-hint">열 이름을 클릭하면 랙 상세를 볼 수 있습니다</span>
                    </div>
                    <div class="card-body" id="preview-content"></div>
                </div>

                <!-- 랙 상세 모달 -->
                <div class="modal-overlay hidden" id="rack-modal">
                    <div class="modal">
                        <div class="modal-header">
                            <h3 id="rack-modal-title"></h3>
                            <button class="modal-close" id="rack-modal-close">&times;</button>
                        </div>
                        <div class="modal-body" id="rack-modal-body"></div>
                    </div>
                </div>

                <!-- SQL 결과 -->
                <div class="card hidden" id="sql-result-card">
                    <div class="card-header"><h3>생성된 SQL</h3></div>
                    <div class="card-body" style="padding: 0;">
                        <div class="sql-output-wrapper">
                            <div class="copy-btn-wrapper">
                                <button class="btn-copy" id="btn-copy-sql">복사</button>
                            </div>
                            <pre class="sql-output" id="sql-output"></pre>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="js/layout.js"></script>
    <script src="js/tasks/idc-request.js"></script>
</body>
</html>
